name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline unit tests
        run: npm test
      # The real protocol needs a local DSH installation and stays out of CI.
      - name: Inspect package and brand on Node 24
        if: matrix.node == 24
        env:
          PACK_JSON: pack-dry-run.json
        run: |
          npm pack --dry-run --json > "$PACK_JSON"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { extname } from 'node:path';

          const reports = JSON.parse(readFileSync(process.env.PACK_JSON, 'utf8'));
          if (!Array.isArray(reports) || reports.length !== 1) {
            throw new Error('npm pack --dry-run --json did not return one package report');
          }
          const report = reports[0];
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = new Set(report.files.map(file => file.path));
          const required = [...new Set([
            'package.json',
            pkg.main,
            ...Object.values(pkg.bin ?? {}),
            'dsh.patch.yml',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'docs/README.md',
            'instructions/RESEARCH.md',
            'scenarios/contract.mjs',
            'skills/validate-data/SKILL.md',
            'evals/skills/validate-data/rubric.md',
            'test/contract.test.mjs',
            'harness-lab/README.md',
            'harness-lab/lab.mjs',
            'harness-lab/protocol.mjs',
            'harness-lab/runtime.mjs',
            'harness-lab/profile/cordis.yml',
            'harness-lab/scenarios/smoke.mjs',
          ])];
          const missing = required.filter(path => !packed.has(path));
          if (missing.length) throw new Error('Missing packed files: ' + missing.join(', '));
          if (report.name !== pkg.name || report.version !== pkg.version) {
            throw new Error('Packed name/version differs from package.json');
          }

          const expectedBrand = {
            name: 'dsh-research-harness',
            author: 'YG',
            repository: 'git+https://github.com/Oseas031/dsh-research-harness.git',
            homepage: 'https://github.com/Oseas031/dsh-research-harness#readme',
            bugs: 'https://github.com/Oseas031/dsh-research-harness/issues',
          };
          const actualBrand = {
            name: pkg.name,
            author: pkg.author,
            repository: pkg.repository?.url,
            homepage: pkg.homepage,
            bugs: pkg.bugs?.url,
          };
          for (const [key, expected] of Object.entries(expectedBrand)) {
            if (actualBrand[key] !== expected) {
              throw new Error('Brand mismatch for ' + key + ': ' + actualBrand[key]);
            }
          }

          const legacyBrand = /hack4claws|clawsgo/i;
          const textExtensions = new Set(['.js', '.mjs', '.json', '.yml', '.yaml', '.md', '.txt', '.py']);
          for (const file of report.files) {
            if (legacyBrand.test(file.path)) throw new Error('Legacy brand in path: ' + file.path);
            if (!textExtensions.has(extname(file.path)) && file.path !== 'LICENSE') continue;
            const text = readFileSync(file.path, 'utf8');
            if (legacyBrand.test(text)) throw new Error('Legacy brand in file: ' + file.path);
          }
          const generated = [...packed].filter(path => path.includes('/.research/') || path.includes('/.tmp-'));
          if (generated.length) throw new Error('Generated lab artifacts packed: ' + generated.join(', '));
          console.log('PACK PASS | ' + packed.size + ' files | required files and brand verified');
          NODE
