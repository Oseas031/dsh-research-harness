# harness-lab 模板：runtime.mjs 在系统临时目录生成真实 profile。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: skill
  name: '@deepseek-ai/dsh-skill'
- id: research-harness-core
  name: '__RESEARCH_HARNESS_ENTRY__'
  config:
    clusterScale: delegate
    ledgerRoot: '__HARNESS_LAB_LEDGER_DIR__'
    verifier:
      kind: evidence
      enabled: true
